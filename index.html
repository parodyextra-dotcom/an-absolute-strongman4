<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>절대강자 분할환전</title>
  
  <!-- Home Screen Icon and Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="절대강자">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%234f46e5'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cpath d='M60 110 L90 50 L120 110 M75 90 L105 90' stroke='white' stroke-width='12' fill='none' stroke-linecap='round'/%3E%3Ctext x='90' y='115' font-family='sans-serif' font-weight='900' font-size='80' fill='white' text-anchor='middle' style='text-shadow: 0 4px 10px rgba(0,0,0,0.2)'%3E%24%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    
    /* Hide scrollbar */
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Bottom nav safe area */
    .bottom-nav { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    
    /* Smooth page transitions */
    .page-enter { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Profit glow */
    .profit-glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15), 0 4px 20px rgba(0,0,0,0.08); }
    .loss-glow { box-shadow: 0 0 20px rgba(239, 68, 68, 0.15), 0 4px 20px rgba(0,0,0,0.08); }
    
    /* Pulse ring for target reached */
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(234, 179, 8, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    .target-pulse { animation: pulseRing 1.5s infinite; }
    
    /* Number ticker */
    .num-tick { transition: all 0.3s ease; }

    /* Investing widget containers */
    .widget-container { 
      border-radius: 12px; 
      overflow: hidden; 
      background: #fff; 
      border: 1px solid #e5e7eb;
    }
    .widget-container iframe {
      width: 100%;
      border: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- Top Header Bar -->
  <header id="topBar" class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
          <span class="text-lg font-black">$</span>
        </div>
        <h1 class="text-lg font-extrabold tracking-tight">절대강자 분할환전</h1>
      </div>
      <div id="headerRight" class="flex items-center gap-2">
        <!-- Dynamic content per tab -->
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="mainContent" class="pt-14 pb-20 max-w-md mx-auto scroll-hide" style="min-height: 100vh;">
    <!-- Pages rendered here -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] bottom-nav">
    <div class="max-w-md mx-auto grid grid-cols-5">
      <button onclick="switchPage('home')" id="nav-home" class="nav-btn flex flex-col items-center py-2 pt-3 gap-0.5 transition-all">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">홈</span>
      </button>
      <button onclick="switchPage('rate')" id="nav-rate" class="nav-btn flex flex-col items-center py-2 pt-3 gap-0.5 transition-all">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">환율</span>
      </button>
      <button onclick="switchPage('invest')" id="nav-invest" class="nav-btn flex flex-col items-center py-2 pt-3 gap-0.5 transition-all">
        <i data-lucide="wallet" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">투자</span>
      </button>
      <button onclick="switchPage('calc')" id="nav-calc" class="nav-btn flex flex-col items-center py-2 pt-3 gap-0.5 transition-all">
        <i data-lucide="calculator" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">계산</span>
      </button>
      <button onclick="switchPage('stats')" id="nav-stats" class="nav-btn flex flex-col items-center py-2 pt-3 gap-0.5 transition-all">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">통계</span>
      </button>
    </div>
  </nav>

  <script>
    // ==========================================
    // STATE
    // ==========================================
    let state = {
      currentPage: 'home',
      activeTab: 'USD',
      usdPhases: [],
      jpyPhases: [],
      eurPhases: [],
      cnyPhases: [],
      expandedPhase: null,
      usdRate: 1445,
      jpyRate: 950,      // 100엔당 원화
      eurRate: 1550,
      cnyRate: 198,
      isEditingRate: false,
      tempRate: 1445,
      usdNextId: 1,
      jpyNextId: 1,
      eurNextId: 1,
      cnyNextId: 1,
      showStats: false,
      statsPeriod: 'yearly',
      statsStartDate: '',
      statsEndDate: '',
      isLoadingRate: false,
      lastUpdated: null,
      soldItemsVisible: 10,
      autoSell: true,
      initialBudget: 10000000,
      // Calculator state
      calcDirection: 'krwToForeign',
      calcAmount: '',
      calcCurrency: 'USD'
    };

    // ==========================================
    // CURRENCY CONFIG
    // ==========================================
    const CURRENCIES = {
      USD: { flag: '🇺🇸', name: '미국 달러', sym: '$', unit: '1달러', decimals: 1, step: 0.1, gradient: 'from-green-500 to-emerald-500', color: 'green' },
      JPY: { flag: '🇯🇵', name: '일본 엔화', sym: '¥', unit: '100엔', decimals: 2, step: 0.01, gradient: 'from-red-500 to-pink-500', color: 'red' },
      EUR: { flag: '🇪🇺', name: '유로', sym: '€', unit: '1유로', decimals: 2, step: 0.01, gradient: 'from-blue-500 to-indigo-500', color: 'blue' },
      CNY: { flag: '🇨🇳', name: '중국 위안', sym: '¥', unit: '1위안', decimals: 2, step: 0.01, gradient: 'from-yellow-500 to-orange-500', color: 'orange' }
    };

    // ==========================================
    // HELPERS
    // ==========================================
    const getPhases = () => {
      switch(state.activeTab) {
        case 'USD': return state.usdPhases;
        case 'JPY': return state.jpyPhases;
        case 'EUR': return state.eurPhases;
        case 'CNY': return state.cnyPhases;
      }
    };
    const setPhases = (phases) => {
      switch(state.activeTab) {
        case 'USD': state.usdPhases = phases; break;
        case 'JPY': state.jpyPhases = phases; break;
        case 'EUR': state.eurPhases = phases; break;
        case 'CNY': state.cnyPhases = phases; break;
      }
    };
    const getCurrentRate = () => {
      switch(state.activeTab) {
        case 'USD': return state.usdRate;
        case 'JPY': return state.jpyRate;
        case 'EUR': return state.eurRate;
        case 'CNY': return state.cnyRate;
      }
    };
    const setCurrentRate = (rate) => {
      switch(state.activeTab) {
        case 'USD': state.usdRate = rate; break;
        case 'JPY': state.jpyRate = rate; break;
        case 'EUR': state.eurRate = rate; break;
        case 'CNY': state.cnyRate = rate; break;
      }
    };
    const getNextId = () => {
      switch(state.activeTab) {
        case 'USD': return state.usdNextId;
        case 'JPY': return state.jpyNextId;
        case 'EUR': return state.eurNextId;
        case 'CNY': return state.cnyNextId;
      }
    };
    const setNextId = (id) => {
      switch(state.activeTab) {
        case 'USD': state.usdNextId = id; break;
        case 'JPY': state.jpyNextId = id; break;
        case 'EUR': state.eurNextId = id; break;
        case 'CNY': state.cnyNextId = id; break;
      }
    };

    const getCurrencyInfo = () => CURRENCIES[state.activeTab];

    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const fmtMan = (n) => (n / 10000).toFixed(1) + '만';
    const fmtManInt = (n) => Math.round(n / 10000) + '만원';

    // JPY: amount is in KRW, buyRate is per 100 JPY
    // So foreign = (amount / buyRate) * 100  (i.e. amount in JPY)
    // KRW value = (foreignJPY / 100) * currentRate
    function getForeignAmount(amount, buyRate, currency) {
      if (currency === 'JPY') return (amount / buyRate) * 100;
      return amount / buyRate;
    }
    function getKRWValue(foreignAmt, rate, currency) {
      if (currency === 'JPY') return (foreignAmt / 100) * rate;
      return foreignAmt * rate;
    }

    // ==========================================
    // FETCH EXCHANGE RATE
    // ==========================================
    async function fetchRate() {
      state.isLoadingRate = true;
      render();
      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/KRW');
        const data = await res.json();
        if (data.rates) {
          if (data.rates.USD) state.usdRate = Math.round((1 / data.rates.USD) * 10) / 10;
          if (data.rates.JPY) state.jpyRate = Math.round((100 / data.rates.JPY) * 100) / 100; // 100엔당
          if (data.rates.EUR) state.eurRate = Math.round((1 / data.rates.EUR) * 100) / 100;
          if (data.rates.CNY) state.cnyRate = Math.round((1 / data.rates.CNY) * 100) / 100;
          state.lastUpdated = new Date();
        }
      } catch (e) {
        console.error(e);
      } finally {
        state.isLoadingRate = false;
        render();
      }
    }

    // ==========================================
    // AUTO SELL CHECK
    // ==========================================
    function checkAutoSell() {
      if (state.autoSell) {
        const phases = getPhases();
        const currentRate = getCurrentRate();
        phases.forEach(p => {
          if (p.completed && !p.sold && currentRate >= p.sellRate + 1) {
            toggleSold(p.id);
          }
        });
      }
    }

    // ==========================================
    // LOCAL STORAGE
    // ==========================================
    function saveToStorage() {
      const data = {
        usdPhases: state.usdPhases,
        jpyPhases: state.jpyPhases,
        eurPhases: state.eurPhases,
        cnyPhases: state.cnyPhases,
        usdNextId: state.usdNextId,
        jpyNextId: state.jpyNextId,
        eurNextId: state.eurNextId,
        cnyNextId: state.cnyNextId,
        usdRate: state.usdRate,
        jpyRate: state.jpyRate,
        eurRate: state.eurRate,
        cnyRate: state.cnyRate
      };
      localStorage.setItem('currencyPortfolio', JSON.stringify(data));
    }

    function loadFromStorage() {
      const saved = localStorage.getItem('currencyPortfolio');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.usdPhases) state.usdPhases = data.usdPhases;
          if (data.jpyPhases) state.jpyPhases = data.jpyPhases;
          if (data.eurPhases) state.eurPhases = data.eurPhases;
          if (data.cnyPhases) state.cnyPhases = data.cnyPhases;
          if (data.usdNextId) state.usdNextId = data.usdNextId;
          if (data.jpyNextId) state.jpyNextId = data.jpyNextId;
          if (data.eurNextId) state.eurNextId = data.eurNextId;
          if (data.cnyNextId) state.cnyNextId = data.cnyNextId;
          if (data.usdRate) state.usdRate = data.usdRate;
          if (data.jpyRate) {
            // Migration: if old jpyRate was per 1 JPY (< 20), convert to per 100 JPY
            state.jpyRate = data.jpyRate < 20 ? data.jpyRate * 100 : data.jpyRate;
          }
          if (data.eurRate) state.eurRate = data.eurRate;
          if (data.cnyRate) state.cnyRate = data.cnyRate;
        } catch (e) {
          console.error(e);
        }
      }
    }

    // ==========================================
    // ACTIONS (Phase management)
    // ==========================================
    function addPhase() {
      const currentRate = getCurrentRate();
      const nextId = getNextId();
      const newPhase = {
        id: nextId,
        amount: 1000000,
        buyRate: currentRate,
        sellRate: currentRate + (state.activeTab === 'JPY' ? 50 : 5),
        completed: false,
        sold: false,
        date: '',
        sellDate: ''
      };
      setPhases([...getPhases(), newPhase]);
      setNextId(nextId + 1);
      state.expandedPhase = newPhase.id;
      saveToStorage();
      render();
    }

    function deletePhase(id) {
      if (confirm('삭제하시겠습니까?')) {
        setPhases(getPhases().filter(p => p.id !== id));
        saveToStorage();
        render();
      }
    }

    function updatePhase(id, field, value) {
      setPhases(getPhases().map(p => p.id === id ? { ...p, [field]: value } : p));
      saveToStorage();
      render();
    }

    function toggleComplete(id) {
      setPhases(getPhases().map(p => p.id === id ? {
        ...p,
        completed: !p.completed,
        date: !p.completed ? new Date().toISOString().split('T')[0] : p.date
      } : p));
      saveToStorage();
      render();
    }

    function toggleSold(id) {
      const phase = getPhases().find(p => p.id === id);
      if (!phase.completed) {
        alert('매수를 먼저 완료해주세요!');
        return;
      }
      const currentRate = getCurrentRate();
      setPhases(getPhases().map(p => p.id === id ? {
        ...p,
        sold: true,
        sellDate: new Date().toISOString().split('T')[0],
        sellRate: currentRate
      } : p));
      saveToStorage();
      render();
    }

    // ==========================================
    // GRADE SYSTEM
    // ==========================================
    function getGrade() {
      const year = new Date().getFullYear();
      const allPhases = [...state.usdPhases, ...state.jpyPhases, ...state.eurPhases, ...state.cnyPhases];
      const allSold = allPhases.filter(p =>
        p.sold && p.sellDate && new Date(p.sellDate).getFullYear() === year
      );
      const totalInv = allSold.reduce((s, p) => s + p.amount, 0);
      // For JPY phases, profit calc is different since rates are per 100 JPY
      const totalProf = allSold.reduce((s, p) => {
        const cur = getCurrencyOfPhase(p);
        const foreignAmt = getForeignAmount(p.amount, p.buyRate, cur);
        return s + (getKRWValue(foreignAmt, p.sellRate, cur) - p.amount);
      }, 0);
      const rate = totalInv > 0 ? (totalProf / totalInv) * 100 : 0;

      let gradeInfo = { grade: '초보', color: 'text-gray-600', bg: 'bg-gray-100', emoji: '🌱' };
      if (allSold.length > 0) {
        if (rate < 0) gradeInfo = { grade: '손실', color: 'text-gray-700', bg: 'bg-gray-200', emoji: '😢' };
        else if (rate < 10) gradeInfo = { grade: '하수', color: 'text-blue-700', bg: 'bg-blue-100', emoji: '💧' };
        else if (rate < 20) gradeInfo = { grade: '중수', color: 'text-green-700', bg: 'bg-green-100', emoji: '🌿' };
        else if (rate < 30) gradeInfo = { grade: '고수', color: 'text-purple-700', bg: 'bg-purple-100', emoji: '🔮' };
        else if (rate < 50) gradeInfo = { grade: '실버', color: 'text-slate-700', bg: 'bg-slate-200', emoji: '🥈' };
        else if (rate < 60) gradeInfo = { grade: '골드', color: 'text-yellow-700', bg: 'bg-yellow-100', emoji: '🥇' };
        else gradeInfo = { grade: '투자의 신', color: 'text-red-700', bg: 'bg-gradient-to-r from-yellow-200 to-red-200', emoji: '👑' };
      }
      return { ...gradeInfo, totalProfit: totalProf, totalInvested: totalInv, returnRate: rate };
    }

    // Determine which currency a phase belongs to
    function getCurrencyOfPhase(phase) {
      if (state.usdPhases.includes(phase)) return 'USD';
      if (state.jpyPhases.includes(phase)) return 'JPY';
      if (state.eurPhases.includes(phase)) return 'EUR';
      if (state.cnyPhases.includes(phase)) return 'CNY';
      // fallback: check by searching
      if (state.usdPhases.find(p => p.id === phase.id && p.amount === phase.amount)) return 'USD';
      if (state.jpyPhases.find(p => p.id === phase.id && p.amount === phase.amount)) return 'JPY';
      if (state.eurPhases.find(p => p.id === phase.id && p.amount === phase.amount)) return 'EUR';
      if (state.cnyPhases.find(p => p.id === phase.id && p.amount === phase.amount)) return 'CNY';
      return 'USD';
    }

    function getRateForCurrency(currency) {
      switch(currency) {
        case 'USD': return state.usdRate;
        case 'JPY': return state.jpyRate;
        case 'EUR': return state.eurRate;
        case 'CNY': return state.cnyRate;
      }
    }

    // ==========================================
    // STATS
    // ==========================================
    function getStats() {
      const phases = getPhases();
      const cur = state.activeTab;
      let sold = phases.filter(p => p.sold && p.sellDate);
      
      if (state.statsStartDate || state.statsEndDate) {
        sold = sold.filter(p => {
          const sellDate = new Date(p.sellDate);
          const start = state.statsStartDate ? new Date(state.statsStartDate) : new Date('1900-01-01');
          const end = state.statsEndDate ? new Date(state.statsEndDate) : new Date('2100-12-31');
          return sellDate >= start && sellDate <= end;
        });
      }
      
      if (sold.length === 0) return [];
      
      const grouped = {};
      sold.forEach(p => {
        const d = new Date(p.sellDate);
        let key;
        if (state.statsPeriod === 'daily') key = p.sellDate;
        else if (state.statsPeriod === 'weekly') key = `${d.getFullYear()}-W${Math.ceil(((d - new Date(d.getFullYear(), 0, 1)) / 86400000 + new Date(d.getFullYear(), 0, 1).getDay() + 1) / 7)}`;
        else if (state.statsPeriod === 'monthly') key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        else key = `${d.getFullYear()}`;

        if (!grouped[key]) grouped[key] = { period: key, count: 0, inv: 0, prof: 0 };
        const f = getForeignAmount(p.amount, p.buyRate, cur);
        grouped[key].count += 1;
        grouped[key].inv += p.amount;
        grouped[key].prof += getKRWValue(f, p.sellRate, cur) - p.amount;
      });

      const sorted = Object.values(grouped).sort((a, b) => a.period.localeCompare(b.period));
      let cumInv = 0, cumProf = 0;
      return sorted.map(item => {
        cumInv += item.inv;
        cumProf += item.prof;
        return {
          ...item,
          rate: ((item.prof / item.inv) * 100).toFixed(2),
          cumInv,
          cumProf,
          cumRate: ((cumProf / cumInv) * 100).toFixed(2)
        };
      }).reverse();
    }

    // Get all transactions sorted by date (most recent first)
    function getAllTransactions() {
      const all = [];
      const addTx = (phases, currency) => {
        phases.forEach(p => {
          if (p.completed && p.date) {
            all.push({ ...p, currency, type: 'buy', sortDate: p.date });
          }
          if (p.sold && p.sellDate) {
            all.push({ ...p, currency, type: 'sell', sortDate: p.sellDate });
          }
        });
      };
      addTx(state.usdPhases, 'USD');
      addTx(state.jpyPhases, 'JPY');
      addTx(state.eurPhases, 'EUR');
      addTx(state.cnyPhases, 'CNY');
      return all.sort((a, b) => b.sortDate.localeCompare(a.sortDate));
    }

    // ==========================================
    // PAGE SWITCHING
    // ==========================================
    function switchPage(page) {
      state.currentPage = page;
      state.expandedPhase = null;
      render();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      state.tempRate = getCurrentRate();
      state.expandedPhase = null;
      state.soldItemsVisible = 10;
      render();
    }

    // ==========================================
    // EVENT HANDLERS
    // ==========================================
    function toggleExpand(id) {
      state.expandedPhase = state.expandedPhase === id ? null : id;
      render();
    }

    function startEditRate() {
      state.isEditingRate = true;
      state.tempRate = getCurrentRate();
      render();
      setTimeout(() => document.getElementById('tempRateInput')?.focus(), 0);
    }

    function confirmRate() {
      const input = document.getElementById('tempRateInput');
      const value = parseFloat(input?.value) || 0;
      setCurrentRate(value);
      state.isEditingRate = false;
      saveToStorage();
      checkAutoSell();
      render();
    }

    function cancelRate() {
      state.isEditingRate = false;
      state.tempRate = getCurrentRate();
      render();
    }

    function toggleAutoSell() {
      state.autoSell = !state.autoSell;
      render();
    }

    function setStatsPeriod(period) {
      state.statsPeriod = period;
      render();
    }

    function setStatsStartDate(date) {
      state.statsStartDate = date;
      render();
    }

    function setStatsEndDate(date) {
      state.statsEndDate = date;
      render();
    }

    function resetStatsDates() {
      state.statsStartDate = '';
      state.statsEndDate = '';
      render();
    }

    function loadMoreSold() {
      state.soldItemsVisible += 10;
      render();
    }

    // ==========================================
    // RENDER CURRENCY TABS (reusable)
    // ==========================================
    function renderCurrencyTabs() {
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-1.5 mb-4">
          <div class="grid grid-cols-4 gap-1">
            ${Object.entries(CURRENCIES).map(([code, info]) => `

        const cur = getCurrencyOfPhase(p);
        const f = getForeignAmount(p.amount, p.buyRate, cur);
        return s + (getKRWValue(f, p.sellRate, cur) - p.amount);
      }, 0);

      const calcUnrealized = (phases, currency, rate) => {
        return phases.filter(p => p.completed && !p.sold).reduce((s, p) => {
          const f = getForeignAmount(p.amount, p.buyRate, currency);
          return s + (getKRWValue(f, rate, currency) - p.amount);
        }, 0);

      const unrealized = calcUnrealized(state.usdPhases, 'USD', state.usdRate)

                        + calcUnrealized(state.eurPhases, 'EUR', state.eurRate)
                        + calcUnrealized(state.cnyPhases, 'CNY', state.cnyRate);
      const totalAll = totalProfit + unrealized;

                width="100%" height="450" frameborder="0" allowtransparency="true"
                style="margin:0; padding:0;"></iframe>
            </div>
          </div>

          <div class="text-center py-2 mb-4">
            <p class="text-[10px] text-gray-300">실시간 데이터는 Investing.com에서 제공됩니다</p>
          </div>
        </div>
      `;
    }

    // ==========================================
    // INVEST PAGE
    // ==========================================
    function renderInvestPage() {
      const phases = getPhases();
      const currentRate = getCurrentRate();
      const ci = getCurrencyInfo();
      const cur = state.activeTab;
      
      const invested = phases.filter(p => p.completed && !p.sold).reduce((s, p) => s + p.amount, 0);
      const foreign = phases.filter(p => p.completed && !p.sold).reduce((s, p) => s + getForeignAmount(p.amount, p.buyRate, cur), 0);
      const avgRate = foreign > 0 ? (invested / (cur === 'JPY' ? foreign / 100 : foreign)).toFixed(2) : 0;
      const unrealized = phases.filter(p => p.completed && !p.sold).reduce((s, p) => {
        const f = getForeignAmount(p.amount, p.buyRate, cur);
        return s + (getKRWValue(f, currentRate, cur) - p.amount);
      }, 0);
      const profit = phases.filter(p => p.sold).reduce((s, p) => {
        const f = getForeignAmount(p.amount, p.buyRate, cur);
        return s + (getKRWValue(f, p.sellRate, cur) - p.amount);
      }, 0);
      
      const sorted = [...phases].sort((a, b) => a.sold && !b.sold ? 1 : !a.sold && b.sold ? -1 : 0);
      const sold = sorted.filter(p => p.sold);
      const active = sorted.filter(p => !p.sold);
      
      const allPhases = [...state.usdPhases, ...state.jpyPhases, ...state.eurPhases, ...state.cnyPhases];
      const cumInvested = allPhases.reduce((s, p) => s + p.amount, 0);

      // Format foreign amount display
      const fmtForeign = (amt) => {
        if (cur === 'JPY') return ci.sym + Math.round(amt).toLocaleString();
        return ci.sym + amt.toFixed(2);
      };

      return `
        <div class="p-4 page-enter">
          <!-- Currency Tabs -->
          ${renderCurrencyTabs()}

          <!-- Portfolio Summary -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2">
              <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i>
              ${cur} 포트폴리오 ${cur === 'JPY' ? '<span class="text-[10px] text-gray-400 font-normal">(100엔 기준)</span>' : ''}
            </h3>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <div class="bg-blue-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">초기예산</p>
                <p class="font-bold text-sm text-blue-600">${fmtManInt(state.initialBudget)}</p>
              </div>
              <div class="bg-purple-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">현재예산</p>
                <p class="font-bold text-sm text-purple-600">${fmtManInt(state.initialBudget + profit)}</p>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-green-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">보유 ${cur}</p>
                <p class="font-bold text-sm text-green-600">${fmtForeign(foreign)}</p>
              </div>
              <div class="bg-orange-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">평균 매수가</p>
                <p class="font-bold text-sm text-orange-600">${avgRate}원${cur === 'JPY' ? '/100엔' : ''}</p>
              </div>
            </div>
          </div>

          <!-- Investment Status -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2">
              <i data-lucide="activity" class="w-4 h-4 text-indigo-500"></i>
              투자 현황
            </h3>
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-blue-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">총 투자금</p>
                <p class="font-bold text-sm text-blue-600">${fmtManInt(invested)}</p>
              </div>
              <div class="bg-orange-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">평가손익</p>
                <p class="font-bold text-sm ${unrealized >= 0 ? 'text-red-600' : 'text-blue-600'}">${unrealized >= 0 ? '+' : ''}${fmtMan(unrealized)}원</p>
              </div>
              <div class="bg-indigo-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">전체 누적투자</p>
                <p class="font-bold text-sm text-indigo-600">${fmtManInt(cumInvested)}</p>
              </div>
              <div class="bg-green-50 rounded-xl p-3">
                <p class="text-[10px] text-gray-500 font-medium">실현수익</p>
                <p class="font-bold text-sm ${profit >= 0 ? 'text-red-600' : 'text-blue-600'}">${profit >= 0 ? '+' : ''}${fmtMan(profit)}원</p>
              </div>
            </div>
          </div>

          <!-- Add Phase Button -->
          <button onclick="addPhase()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-indigo-200 mb-4 active:scale-[0.98] transition-transform">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            새 매수 추가
          </button>

          <!-- Active Phases -->
          ${active.map((p, i) => renderActivePhase(p, i, currentRate, ci, cur)).join('')}

          <!-- Sold Phases -->
          ${sold.length > 0 ? `
            <div class="mt-2">
              <h3 class="font-bold text-gray-600 mb-3 text-sm flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
                매도 완료 (${sold.length}건)
              </h3>
              ${sold.slice(0, state.soldItemsVisible).map(p => renderSoldPhase(p, ci, cur)).join('')}
              ${sold.length > state.soldItemsVisible ? `
                <button onclick="loadMoreSold()" class="w-full bg-gray-100 text-gray-600 py-2.5 rounded-xl font-semibold text-sm hover:bg-gray-200 transition-colors">
                  더보기 (${sold.length - state.soldItemsVisible}건 남음)
                </button>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderActivePhase(p, i, currentRate, ci, cur) {
      const fRaw = getForeignAmount(p.amount, p.buyRate, cur);
      const diff = currentRate - p.buyRate;
      const cp = getKRWValue(fRaw, currentRate, cur) - p.amount;
      const targetReached = p.completed && currentRate >= p.sellRate;
      const isExpanded = state.expandedPhase === p.id;
      const rateLabel = cur === 'JPY' ? '/100엔' : '';

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 mb-3 overflow-hidden ${targetReached ? 'target-pulse border-yellow-300' : ''}">
          <div onclick="toggleExpand(${p.id})" class="p-4 cursor-pointer ${p.completed ? 'bg-gradient-to-r from-green-50 to-emerald-50' : 'bg-gradient-to-r from-blue-50 to-indigo-50'}">
            <div class="flex justify-between items-start">
              <div class="flex items-start gap-3 flex-1">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center ${p.completed ? 'bg-green-100' : 'bg-blue-100'}">
                  ${p.completed ? '<i data-lucide="check-circle" class="w-5 h-5 text-green-600"></i>' : '<i data-lucide="shopping-cart" class="w-5 h-5 text-blue-600"></i>'}
                </div>
                <div class="flex-1">
                  <p class="font-bold text-sm text-gray-800">${i + 1}차 매수</p>
                  <p class="text-[10px] text-gray-500 mt-0.5">${p.completed ? `매수일: ${p.date}` : '매수대기'}</p>
                  ${p.completed ? `
                    <div class="mt-2 flex flex-wrap gap-2">
                      <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold ${diff >= 0 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                        환율차 ${diff >= 0 ? '+' : ''}${diff.toFixed(ci.decimals)}원
                      </span>
                      <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold ${cp >= 0 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                        ${cp >= 0 ? '+' : ''}${fmtMan(cp)}원
                      </span>
                      ${targetReached ? '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-yellow-100 text-yellow-700">🎯 목표도달!</span>' : ''}
                    </div>
                  ` : ''}
                </div>
              </div>
              <div class="text-gray-400">
                ${isExpanded ? '<i data-lucide="chevron-up" class="w-5 h-5"></i>' : '<i data-lucide="chevron-down" class="w-5 h-5"></i>'}
              </div>
            </div>
          </div>
          ${isExpanded ? `
            <div class="p-4 space-y-3 border-t border-gray-100">
              <div>
                <label class="text-[10px] text-gray-500 block mb-1 font-semibold">투자금액 (KRW)</label>
                <input type="number" value="${p.amount}" onchange="updatePhase(${p.id}, 'amount', parseFloat(this.value) || 0)" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400" ${p.completed ? 'disabled' : ''} />
              </div>
              <div>
                <label class="text-[10px] text-gray-500 block mb-1 font-semibold">매수환율${rateLabel}</label>
                <input type="number" value="${p.buyRate}" onchange="updatePhase(${p.id}, 'buyRate', parseFloat(this.value) || 0)" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400" ${p.completed ? 'disabled' : ''} step="${ci.step}" />
              </div>
              <div>
                <label class="text-[10px] text-gray-500 block mb-1 font-semibold">목표 매도환율${rateLabel}</label>
                <input type="number" value="${p.sellRate}" onchange="updatePhase(${p.id}, 'sellRate', parseFloat(this.value) || 0)" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400" step="${ci.step}" />
              </div>
              <div class="bg-gray-50 rounded-xl p-3 space-y-1.5">
                <p class="text-xs font-medium text-gray-700">💵 ${cur === 'JPY' ? ci.sym + Math.round(fRaw).toLocaleString() : ci.sym + fRaw.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                <p class="text-xs font-medium ${cp >= 0 ? 'text-red-600' : 'text-blue-600'}">📈 지금 매도시: ${cp >= 0 ? '+' : ''}${fmt(Math.round(cp))}원</p>
              </div>
              <div class="flex gap-2">
                ${!p.completed ? `<button onclick="toggleComplete(${p.id})" class="flex-1 bg-gradient-to-r from-green-500 to-emerald-500 text-white py-2.5 rounded-xl font-bold text-sm shadow-md">매수완료</button>` : ''}
                ${p.completed ? `<button onclick="toggleSold(${p.id})" class="flex-1 bg-gradient-to-r from-purple-500 to-indigo-500 text-white py-2.5 rounded-xl font-bold text-sm shadow-md">매도 (${cp >= 0 ? '+' : ''}${fmtMan(cp)}원)</button>` : ''}
                <button onclick="deletePhase(${p.id})" class="px-4 bg-red-500 text-white rounded-xl shadow-md flex items-center justify-center">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSoldPhase(p, ci, cur) {
      const f = getForeignAmount(p.amount, p.buyRate, cur);
      const pr = getKRWValue(f, p.sellRate, cur) - p.amount;
      const isExpanded = state.expandedPhase === p.id;

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 mb-3 overflow-hidden opacity-80">
          <div onclick="toggleExpand(${p.id})" class="bg-gray-50 p-4 cursor-pointer">
            <div class="flex justify-between items-start">
              <div class="flex items-start gap-3 flex-1">
                <div class="w-10 h-10 rounded-xl bg-gray-200 flex items-center justify-center">
                  <i data-lucide="check" class="w-5 h-5 text-gray-500"></i>
                </div>
                <div class="flex-1">
                  <p class="font-bold text-sm text-gray-700">매도완료 ${p.id}차</p>
                  <p class="text-[10px] text-gray-500">매도일: ${p.sellDate}</p>
                  <span class="inline-flex items-center mt-1 px-2 py-0.5 rounded-md text-[10px] font-bold ${pr >= 0 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                    ${pr >= 0 ? '+' : ''}${fmtMan(pr)}원 (${((pr / p.amount) * 100).toFixed(2)}%)
                  </span>
                </div>
              </div>
              <div class="text-gray-400">
                ${isExpanded ? '<i data-lucide="chevron-up" class="w-5 h-5"></i>' : '<i data-lucide="chevron-down" class="w-5 h-5"></i>'}
              </div>
            </div>
          </div>
          ${isExpanded ? `
            <div class="p-4 bg-gray-50 space-y-2 border-t border-gray-100">
              <input type="number" value="${p.amount}" onchange="updatePhase(${p.id}, 'amount', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" placeholder="매수금액" />
              <input type="number" value="${p.buyRate}" onchange="updatePhase(${p.id}, 'buyRate', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" step="${ci.step}" placeholder="매수환율" />
              <input type="number" value="${p.sellRate}" onchange="updatePhase(${p.id}, 'sellRate', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" step="${ci.step}" placeholder="매도환율" />
              <input type="date" value="${p.date}" onchange="updatePhase(${p.id}, 'date', this.value)" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" />
              <input type="date" value="${p.sellDate}" onchange="updatePhase(${p.id}, 'sellDate', this.value)" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" />
              <button onclick="deletePhase(${p.id})" class="w-full bg-red-500 text-white py-2.5 rounded-xl flex items-center justify-center gap-2 font-bold text-sm">
                <i data-lucide="trash-2" class="w-4 h-4"></i> 삭제
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ==========================================
    // CALC PAGE
    // ==========================================
    function renderCalcPage() {
      const cur = state.calcCurrency;
      const ci = CURRENCIES[cur];
      const rate = getRateForCurrency(cur);
      const amount = parseFloat(state.calcAmount) || 0;

      let result = 0;
      if (state.calcDirection === 'krwToForeign') {
        if (cur === 'JPY') {
          result = rate > 0 ? (amount / rate) * 100 : 0; // KRW -> JPY
        } else {
          result = rate > 0 ? amount / rate : 0;
        }
      } else {
        if (cur === 'JPY') {
          result = (amount / 100) * rate; // JPY -> KRW
        } else {
          result = amount * rate;
        }
      }

      return `
        <div class="p-4 page-enter">
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
              <i data-lucide="calculator" class="w-5 h-5 text-indigo-500"></i>
              환전 계산기
            </h2>

            <!-- Currency selector -->
            <div class="grid grid-cols-4 gap-1.5 mb-4">
              ${Object.entries(CURRENCIES).map(([code, info]) => `
                <button onclick="state.calcCurrency='${code}'; render();" class="py-2 rounded-xl font-bold text-xs transition-all ${state.calcCurrency === code ? 'bg-gradient-to-r ' + info.gradient + ' text-white shadow-md' : 'bg-gray-100 text-gray-500'}">
                  ${info.flag} ${code}
                </button>
              `).join('')}
            </div>

            <!-- Current rate display -->
            <div class="bg-indigo-50 rounded-xl p-3 mb-4 text-center">
              <p class="text-[10px] text-indigo-600 font-medium">적용 환율</p>
              <p class="text-xl font-bold text-indigo-700">${ci.flag} ${cur === 'JPY' ? '100' : '1'} ${cur} = ${rate.toFixed(ci.decimals)}원</p>
            </div>

            <!-- Direction toggle -->
            <button onclick="state.calcDirection = state.calcDirection === 'krwToForeign' ? 'foreignToKrw' : 'krwToForeign'; render();" class="w-full flex items-center justify-center gap-3 mb-4 py-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors">
              <span class="text-sm font-bold ${state.calcDirection === 'krwToForeign' ? 'text-indigo-600' : 'text-gray-500'}">🇰🇷 KRW</span>
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                <i data-lucide="arrow-right-left" class="w-4 h-4 text-indigo-600"></i>
              </div>
              <span class="text-sm font-bold ${state.calcDirection === 'foreignToKrw' ? 'text-indigo-600' : 'text-gray-500'}">${ci.flag} ${cur}</span>
            </button>

            <!-- Input -->
            <div class="mb-4">
              <label class="text-xs text-gray-500 font-semibold block mb-1.5">
                ${state.calcDirection === 'krwToForeign' ? '원화 (KRW)' : `${cur} (${ci.sym})`} 입력
              </label>
              <input type="number" id="calcInput" value="${state.calcAmount}" oninput="state.calcAmount = this.value; render();"
                class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl text-xl font-bold text-center focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400"
                placeholder="금액을 입력하세요" />
            </div>

            <!-- Result -->
            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 rounded-xl p-5 text-white text-center">
              <p class="text-xs text-white/70 font-medium mb-1">
                ${state.calcDirection === 'krwToForeign' ? `${cur}로 환전시` : '원화 환전시'}
              </p>
              <p class="text-3xl font-black">
                ${state.calcDirection === 'krwToForeign' 
                  ? (cur === 'JPY' 
                    ? ci.sym + Math.round(result).toLocaleString()
                    : ci.sym + result.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}))
                  : `${fmt(Math.round(result))}원`
                }
              </p>
            </div>
          </div>

          <!-- Quick amounts -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
            <p class="text-xs text-gray-500 font-semibold mb-3">빠른 입력</p>
            <div class="grid grid-cols-3 gap-2">
              ${(state.calcDirection === 'krwToForeign' 
                ? [100000, 500000, 1000000, 3000000, 5000000, 10000000]
                : (cur === 'USD' ? [100, 500, 1000, 3000, 5000, 10000] 
                  : cur === 'JPY' ? [10000, 50000, 100000, 300000, 500000, 1000000]
                  : cur === 'EUR' ? [100, 500, 1000, 3000, 5000, 10000]
                  : [100, 500, 1000, 3000, 5000, 10000])
              ).map(v => `
                <button onclick="state.calcAmount='${v}'; render(); setTimeout(() => document.getElementById('calcInput').value='${v}', 0);" 
                  class="py-2.5 rounded-xl text-sm font-bold bg-gray-100 text-gray-700 hover:bg-indigo-100 hover:text-indigo-700 transition-colors">
                  ${state.calcDirection === 'krwToForeign' 
                    ? (v >= 10000 ? (v/10000) + '만' : fmt(v))
                    : ci.sym + fmt(v)
                  }
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // STATS PAGE
    // ==========================================
    function renderStatsPage() {
      const stats = getStats();
      const grade = getGrade();

      return `
        <div class="p-4 page-enter">
          <!-- Currency Tabs -->
          ${renderCurrencyTabs()}

          <!-- Grade Card -->
          <div class="${grade.bg} rounded-2xl shadow-sm p-4 mb-4 border border-gray-100">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                <span class="text-2xl">${grade.emoji}</span>
                <div>
                  <p class="text-[10px] text-gray-500 font-medium">올해 투자 등급</p>
                  <p class="text-lg font-extrabold ${grade.color}">${grade.grade}</p>
                </div>
              </div>
              <div class="text-right">
                <p class="text-xl font-bold ${grade.totalProfit >= 0 ? 'text-red-600' : 'text-blue-600'}">${grade.totalProfit >= 0 ? '+' : ''}${fmtMan(grade.totalProfit)}원</p>
                <p class="text-xs font-semibold ${grade.totalProfit >= 0 ? 'text-red-500' : 'text-blue-500'}">${grade.returnRate >= 0 ? '+' : ''}${grade.returnRate.toFixed(2)}%</p>
              </div>
            </div>
          </div>

          <!-- Stats Controls -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="bar-chart-3" class="w-4 h-4 text-indigo-500"></i>
                기간별 통계
              </h3>
              <div class="flex gap-1">
                ${['daily', 'weekly', 'monthly', 'yearly'].map(p => `
                  <button onclick="setStatsPeriod('${p}')" class="px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition-all ${state.statsPeriod === p ? 'bg-indigo-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600'}">
                    ${p === 'daily' ? '일' : p === 'weekly' ? '주' : p === 'monthly' ? '월' : '년'}
                  </button>
                `).join('')}
              </div>
            </div>
            
            <div class="p-3 bg-gray-50 rounded-xl mb-3">
              <p class="text-[10px] font-semibold text-gray-600 mb-2">📅 기간 검색</p>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-[10px] text-gray-500 block mb-1">시작일</label>
                  <input type="date" value="${state.statsStartDate}" onchange="setStatsStartDate(this.value)" class="w-full px-2 py-1.5 border border-gray-200 rounded-lg text-xs" />
                </div>
                <div>
                  <label class="text-[10px] text-gray-500 block mb-1">종료일</label>
                  <input type="date" value="${state.statsEndDate}" onchange="setStatsEndDate(this.value)" class="w-full px-2 py-1.5 border border-gray-200 rounded-lg text-xs" />
                </div>
              </div>
              ${(state.statsStartDate || state.statsEndDate) ? `
                <button onclick="resetStatsDates()" class="mt-2 w-full bg-gray-200 text-gray-600 py-1.5 rounded-lg text-[10px] font-bold hover:bg-gray-300 transition-colors">
                  기간 초기화
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Stats Results -->
          ${stats.length > 0 ? `
            <div class="space-y-3">
              ${stats.map(s => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 overflow-hidden">
                  <div class="flex justify-between items-start mb-3">
                    <div>
                      <p class="font-bold text-sm text-gray-800">${s.period}</p>
                      <p class="text-[10px] text-gray-500">매도 ${s.count}건</p>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${parseFloat(s.rate) >= 0 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                      ${parseFloat(s.rate) >= 0 ? '+' : ''}${s.rate}%
                    </span>
                  </div>
                  <div class="grid grid-cols-2 gap-2 mb-3">
                    <div class="bg-blue-50 rounded-xl p-2.5">
                      <p class="text-[10px] text-gray-500">투자금</p>
                      <p class="font-bold text-sm text-blue-600">${fmtManInt(s.inv)}</p>
                    </div>
                    <div class="bg-red-50 rounded-xl p-2.5">
                      <p class="text-[10px] text-gray-500">실현수익</p>
                      <p class="font-bold text-sm ${s.prof >= 0 ? 'text-red-600' : 'text-blue-600'}">${s.prof >= 0 ? '+' : ''}${fmtMan(s.prof)}원</p>
                    </div>
                  </div>
                  <div class="border-t border-gray-100 pt-2.5">
                    <p class="text-[10px] font-semibold text-gray-500 mb-2">누적 현황</p>
                    <div class="grid grid-cols-3 gap-2">
                      <div class="bg-indigo-50 rounded-lg p-2">
                        <p class="text-[10px] text-gray-500">누적투자</p>
                        <p class="font-bold text-[11px] text-indigo-600">${fmtManInt(s.cumInv)}</p>
                      </div>
                      <div class="bg-pink-50 rounded-lg p-2">
                        <p class="text-[10px] text-gray-500">누적수익</p>
                        <p class="font-bold text-[11px] ${s.cumProf >= 0 ? 'text-pink-600' : 'text-blue-600'}">${s.cumProf >= 0 ? '+' : ''}${fmtMan(s.cumProf)}원</p>
                      </div>
                      <div class="bg-amber-50 rounded-lg p-2">
                        <p class="text-[10px] text-gray-500">누적률</p>
                        <p class="font-bold text-[11px] ${s.cumProf >= 0 ? 'text-amber-600' : 'text-blue-600'}">${parseFloat(s.cumRate) >= 0 ? '+' : ''}${s.cumRate}%</p>
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 py-12 text-center">
              <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <i data-lucide="bar-chart-3" class="w-8 h-8 text-gray-300"></i>
              </div>
              <p class="text-sm text-gray-400 font-medium">통계 데이터가 없습니다</p>
              <p class="text-xs text-gray-300 mt-1">매도 완료된 거래가 있어야 통계가 표시됩니다</p>
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // INITIALIZE
    // ==========================================
    loadFromStorage();
    fetchRate();
    render();

    // Auto refresh rate every 10 minutes
    setInterval(fetchRate, 600000);
  </script>
</body>
</html>
